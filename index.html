<!DOCTYPE html>
<html>
    <head>
        <title>External Data Exercise</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="script.js" defer></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    </head>
    <body>
        <nav>
            <a href="index.html">Home</a>
            <a href="write-up.html">Write-Up</a>
        </nav>
        <section class="py-10" x-data="fetchUsers()" x-init="init()">
            <div class="container mx-auto px-4">
                <h2 class="text-3xl font-bold text-center mb-8">Our Team</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <template x-for="user in users" :key="user.id">
                        <div class="bg-white shadow-md rounded-lg p-6">
                            <h3 class="text-xl font-semibold" x-text="user.name"></h3>
                            <p class="text-gray-600" x-text="user.email"></p>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <section class="py-10 bg-gray-50" x-data="fetchPosts()" x-init="init()">
            <div class="container mx-auto px-4">
                <h2 class="text-3xl font-bold text-center mb-8">Latest Posts</h2>
                <div class="space-y-4">
                    <template x-for="post in posts" :key="post.id">
                        <div class="bg-blue-100 border-l-4 border-blue-500 p-6 rounded">
                            <h3 class="text-xl font-semibold text-blue-900" x-text="formatTitle(post.title)"></h3>
                            <p class="text-blue-800 mt-2" x-text="post.body"></p>
                        </div>
                    </template>
                </div>
            </div>
        </section>

    </body>
</html>
